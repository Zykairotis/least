name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Exploration Benchmark
        run: npm run benchmark:exploration

      - name: Scale Benchmark Tiny
        run: npm run benchmark:scale:tiny

      - name: Scale Benchmark Small
        run: npm run benchmark:scale:small

      - name: Smoke Test
        run: npm run smoke

      - name: Check Package Contents
        run: npm pack --dry-run
